<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Sorairo Studio Importer</title>
<style>
  :root {
    --ink: #1b1b1b;
    --ink-soft: #6b6b6b;
    --line: #e3e1db;
    --bg: #ffffff;
    --field: #f7f6f2;
    --accent: #1f3a5f;
    --danger: #a6301f;
    --ok: #2c6e49;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    line-height: 1.55;
    color: var(--ink);
    background: var(--bg);
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 12px 14px 10px;
    border-bottom: 1px solid var(--line);
    flex: 0 0 auto;
  }
  h1 { font-size: 13px; margin: 0; font-weight: 600; letter-spacing: .02em; }
  header p { margin: 3px 0 0; font-size: 11px; color: var(--ink-soft); }
  main { flex: 1 1 auto; overflow-y: auto; padding: 12px 14px; }
  section { margin-bottom: 14px; }
  label.block { display: block; font-size: 11px; color: var(--ink-soft); margin-bottom: 4px; }
  textarea {
    width: 100%;
    height: 132px;
    resize: vertical;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11px;
    line-height: 1.5;
    padding: 8px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--field);
    color: var(--ink);
  }
  input[type="text"] {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--field);
    font: inherit;
    color: var(--ink);
  }
  textarea:focus, input:focus { outline: 2px solid rgba(31, 58, 95, .28); outline-offset: 1px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .file-row { justify-content: space-between; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; }
  .opts label { display: flex; align-items: center; gap: 6px; font-size: 12px; cursor: pointer; }
  input[type="checkbox"] { accent-color: var(--accent); margin: 0; }
  .hint { font-size: 11px; color: var(--ink-soft); margin: 4px 0 0; }
  fieldset { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px 10px; margin: 0; }
  legend { font-size: 11px; color: var(--ink-soft); padding: 0 4px; }
  #log {
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--field);
    padding: 8px;
    height: 116px;
    overflow-y: auto;
    font-size: 11px;
    line-height: 1.5;
  }
  #log div { display: flex; gap: 6px; padding: 1px 0; }
  #log .t { color: var(--ink-soft); flex: 0 0 auto; }
  #log .d { color: var(--ink-soft); }
  #log .ok { color: var(--ok); font-weight: 600; }
  #log .ng { color: var(--danger); }
  #errors {
    display: none;
    border: 1px solid #e6c6bf;
    background: #fdf3f1;
    color: var(--danger);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 11.5px;
  }
  #errors strong { display: block; font-size: 12px; margin-bottom: 4px; }
  #errors ul { margin: 0; padding-left: 16px; }
  footer {
    flex: 0 0 auto;
    border-top: 1px solid var(--line);
    padding: 10px 14px;
    display: flex;
    gap: 8px;
    align-items: center;
    background: var(--bg);
  }
  button {
    font: inherit;
    border-radius: 6px;
    padding: 7px 14px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  button.file { padding: 5px 10px; font-size: 12px; }
  #status { margin-left: auto; font-size: 11px; color: var(--ink-soft); }
  input[type="file"] { display: none; }
</style>
</head>
<body>
  <header>
    <h1>Sorairo Studio Importer</h1>
    <p>spec.json から Variables / Styles / フレーム / コンポーネントを生成します。</p>
  </header>

  <main>
    <section>
      <div class="row file-row">
        <label class="block" for="spec" style="margin:0">spec.json</label>
        <div class="row">
          <button class="file" id="pick" type="button">ファイルを選ぶ…</button>
          <button class="file" id="clear" type="button">消す</button>
        </div>
      </div>
      <input type="file" id="file" accept="application/json,.json">
      <textarea id="spec" spellcheck="false" placeholder='ここに spec.json を貼り付けるか、「ファイルを選ぶ…」で .json を読み込みます。&#10;{ "version": 1, "name": "…", "tokens": { … }, "frames": [ … ], "components": [ … ] }'></textarea>
      <p class="hint" id="specInfo">未入力</p>
    </section>

    <section>
      <fieldset>
        <legend>生成するもの</legend>
        <div class="opts">
          <label><input type="checkbox" id="optVariables" checked> Variables を作る</label>
          <label><input type="checkbox" id="optStyles" checked> Styles を作る</label>
          <label><input type="checkbox" id="optComponents" checked> Components を作る</label>
          <label><input type="checkbox" id="optFrames" checked> 画像フレームを作る</label>
        </div>
        <div style="margin-top:10px">
          <label class="block" for="pageName">ページ名（空なら「Sorairo / &lt;spec.name&gt;」）</label>
          <input type="text" id="pageName" placeholder="Sorairo / 案件名">
        </div>
      </fieldset>
    </section>

    <section>
      <label class="block">ログ</label>
      <div id="log" aria-live="polite"></div>
    </section>

    <section>
      <div id="errors" role="alert"></div>
    </section>
  </main>

  <footer>
    <button class="primary" id="run" type="button">生成</button>
    <button id="close" type="button">閉じる</button>
    <span id="status"></span>
  </footer>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var specEl = $("spec"), logEl = $("log"), errEl = $("errors"), statusEl = $("status");
  var runBtn = $("run");

  function now() {
    var d = new Date();
    function p(n) { return (n < 10 ? "0" : "") + n; }
    return p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  }
  function log(text, detail, cls) {
    var row = document.createElement("div");
    var t = document.createElement("span");
    t.className = "t";
    t.textContent = now();
    var m = document.createElement("span");
    if (cls) m.className = cls;
    m.textContent = text;
    row.appendChild(t);
    row.appendChild(m);
    if (detail) {
      var d = document.createElement("span");
      d.className = "d";
      d.textContent = "— " + detail;
      row.appendChild(d);
    }
    logEl.appendChild(row);
    logEl.scrollTop = logEl.scrollHeight;
  }
  function clearErrors() { errEl.style.display = "none"; errEl.textContent = ""; }
  function showErrors(message, list) {
    errEl.textContent = "";
    var strong = document.createElement("strong");
    strong.textContent = message;
    errEl.appendChild(strong);
    if (list && list.length) {
      var ul = document.createElement("ul");
      for (var i = 0; i < list.length; i++) {
        var li = document.createElement("li");
        li.textContent = list[i];
        ul.appendChild(li);
      }
      errEl.appendChild(ul);
    }
    errEl.style.display = "block";
  }

  function describeSpec(text) {
    if (!text.trim()) { $("specInfo").textContent = "未入力"; return null; }
    try {
      var spec = JSON.parse(text);
      var colors = spec && spec.tokens && spec.tokens.color ? Object.keys(spec.tokens.color).length : 0;
      var frames = spec && spec.frames ? spec.frames.length : 0;
      var comps = spec && spec.components ? spec.components.length : 0;
      var variants = 0;
      if (spec && spec.components) {
        for (var i = 0; i < spec.components.length; i++) {
          variants += (spec.components[i].variants || []).length;
        }
      }
      $("specInfo").textContent =
        "「" + (spec && spec.name ? spec.name : "名称未設定") + "」／色 " + colors +
        " ・フレーム " + frames + " ・コンポーネント " + comps + "（" + variants + " バリアント）";
      return spec;
    } catch (e) {
      $("specInfo").textContent = "JSON として読めません: " + e.message;
      return null;
    }
  }

  specEl.addEventListener("input", function () { describeSpec(specEl.value); clearErrors(); });

  $("pick").addEventListener("click", function () { $("file").click(); });
  $("clear").addEventListener("click", function () {
    specEl.value = "";
    $("file").value = "";
    describeSpec("");
    clearErrors();
  });
  $("file").addEventListener("change", function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      specEl.value = String(reader.result || "");
      describeSpec(specEl.value);
      clearErrors();
      log("読み込みました", file.name);
    };
    reader.onerror = function () { showErrors("ファイルを読めませんでした。", [file.name]); };
    reader.readAsText(file, "utf-8");
  });

  runBtn.addEventListener("click", function () {
    clearErrors();
    var text = specEl.value;
    if (!text.trim()) { showErrors("spec.json が空です。", ["貼り付けるか、ファイルを選んでください。"]); return; }
    var spec;
    try {
      spec = JSON.parse(text);
    } catch (e) {
      showErrors("JSON として読めませんでした。", [e.message]);
      return;
    }
    runBtn.disabled = true;
    statusEl.textContent = "生成中…";
    log("生成を開始します", null, "ok");
    parent.postMessage({
      pluginMessage: {
        type: "import",
        spec: spec,
        options: {
          variables: $("optVariables").checked,
          styles: $("optStyles").checked,
          components: $("optComponents").checked,
          frames: $("optFrames").checked,
          pageName: $("pageName").value
        }
      }
    }, "*");
  });

  $("close").addEventListener("click", function () {
    parent.postMessage({ pluginMessage: { type: "cancel" } }, "*");
  });

  window.onmessage = function (event) {
    var msg = event.data && event.data.pluginMessage;
    if (!msg) return;
    if (msg.type === "progress") {
      log(msg.text || "", msg.detail || "");
    } else if (msg.type === "error") {
      runBtn.disabled = false;
      statusEl.textContent = "失敗";
      log(msg.message || "エラー", null, "ng");
      showErrors(msg.message || "エラーが発生しました。", msg.errors || []);
    } else if (msg.type === "done") {
      runBtn.disabled = false;
      var s = msg.summary || {};
      statusEl.textContent = "完了";
      log("完了", null, "ok");
      log(
        "Variables " + (s.variables || 0) + " ・Styles " + (s.styles || 0) +
        " ・フレーム " + (s.frames || 0) + " ・コンポーネント " + (s.components || 0) +
        "（" + (s.variants || 0) + " バリアント）",
        "ページ: " + (s.page || "")
      );
      if (s.substitutions && s.substitutions.length) {
        for (var i = 0; i < s.substitutions.length; i++) log("フォント代替", s.substitutions[i], "ng");
      }
      if (s.warnings && s.warnings.length) {
        showErrors("生成は完了しましたが、注意点があります。", s.warnings);
      }
    }
  };

  describeSpec(specEl.value);
})();
</script>
</body>
</html>
