[build]
  command = "npm run build"
  publish = "dist"

# 空色 Studio（/studio/）は別エントリ。SPA フォールバックより先に解決する
[[redirects]]
  from = "/studio"
  to = "/studio/index.html"
  status = 200

[[redirects]]
  from = "/studio/*"
  to = "/studio/index.html"
  status = 200

[[redirects]]
  from = "/research/*"
  to = "https://ryuwryyy.github.io/niwa-sorairo/"
  status = 302

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
