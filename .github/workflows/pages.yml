# 「聴く」を GitHub Pages(https://ryuwryyy.github.io/niwa-sorairo/)に無料で公開する。
# 庭アプリ(niwa-sorairo.vercel.app)とは別の場所。API とキーは Vercel に残る。
# 初回だけ: GitHub の Settings → Pages → Build and deployment → Source を「GitHub Actions」にする。
name: Deploy research site

on:
  push:
    branches: [main]
    paths:
      - "research/**"
      - "vite.research.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build
        run: npm run build:research
        env:
          # API の置き場所。Vercel のドメインを変えたらリポジトリ変数 RESEARCH_API_BASE で上書きする
          VITE_API_BASE: ${{ vars.RESEARCH_API_BASE || 'https://niwa-sorairo.vercel.app' }}
          RESEARCH_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-research

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
