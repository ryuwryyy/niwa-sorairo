<style>
  body { font: 12px/1.6 system-ui, sans-serif; margin: 12px; color: #1E2126; }
  textarea { width: 100%; height: 190px; box-sizing: border-box; font: 11px/1.4 ui-monospace, monospace; border: 1px solid #ddd; border-radius: 6px; padding: 8px; }
  label { display: flex; gap: 6px; align-items: center; margin: 6px 0; }
  button { background: #2B4FC7; color: #fff; border: 0; border-radius: 6px; padding: 8px 14px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 8px; }
  p { color: #5D636E; margin: 0 0 8px; }
  #err { color: #B4471F; }
</style>
<p>「聴く」のソーシャルリスニング・インタビュー整理・深掘りレポートで <b>FigJamへ(コピー)</b> を押し、ここに貼り付けてください。</p>
<textarea id="src" placeholder='{"kind":"kiku/v1", ...}'></textarea>
<label><input type="checkbox" id="aff" checked> アフィニティ図(分類ごとのセクションと付箋)</label>
<label><input type="checkbox" id="flow" checked> 行動フロー(段階ごとのステップと矢印)</label>
<div id="err"></div>
<button id="go">ボードに配置する</button>
<script>
  document.getElementById("go").onclick = () => {
    const err = document.getElementById("err");
    err.textContent = "";
    let data;
    try { data = JSON.parse(document.getElementById("src").value); }
    catch { err.textContent = "JSONとして読めません。コピーし直してください。"; return; }
    if (!["kiku/v1", "kiku/report-v1", "kiku/listening-v1"].includes(data.kind)) { err.textContent = "「聴く」から書き出したデータではないようです。"; return; }
    parent.postMessage({ pluginMessage: {
      type: "import", data,
      affinity: document.getElementById("aff").checked,
      flow: document.getElementById("flow").checked,
    } }, "*");
  };
  onmessage = (e) => {
    const m = e.data.pluginMessage;
    if (m && m.type === "error") document.getElementById("err").textContent = m.message;
  };
</script>
